# ============================================================
#  grub-usb.cfg —— GRUB2 loopback 多启动菜单模板
#  由 make-usb.sh 部署到 U 盘 ESP 的 /boot/grub/grub.cfg
#
#  数据分区：exFAT，卷标 DATA，ISO 放在其 /ISO 子目录
#  挂载后路径形如：/run/media/<user>/DATA/ISO/xxx.iso
#  详细说明见 docs/bootable-usb.md
# ============================================================

set timeout=15
set default=0

# ---- 载入必要模块 ----
insmod part_gpt
insmod part_msdos
insmod fat
insmod exfat
insmod ntfs
insmod iso9660
insmod udf
insmod loopback
insmod linux
insmod search_label
insmod test
insmod echo
insmod all_video
insmod gfxterm

# ---- 按卷标定位数据分区 ----
if search --no-floppy --label --set=isopart DATA; then
    set isodir=/ISO
    echo "数据分区: $isopart"
else
    echo "!! 找不到卷标为 DATA 的数据分区，5 秒后进入菜单"
    sleep 5
fi

# ====================== 菜单项 ======================

menuentry "Arch Linux 2026.09.01 (x86_64)" {
    search --no-floppy --label --set=isopart DATA
    set isofile=$isodir/archlinux-2026.09.01-x86_64.iso
    loopback loop ($isopart)$isofile
    linux  (loop)/arch/boot/x86_64/vmlinuz-linux img_dev=/dev/disk/by-label/DATA img_loop=$isofile
    initrd (loop)/arch/boot/x86_64/initramfs-linux.img
}

menuentry "Arch Linux 2026.07.01 (x86_64)" {
    search --no-floppy --label --set=isopart DATA
    set isofile=$isodir/archlinux-2026.07.01-x86_64.iso
    loopback loop ($isopart)$isofile
    linux  (loop)/arch/boot/x86_64/vmlinuz-linux img_dev=/dev/disk/by-label/DATA img_loop=$isofile
    initrd (loop)/arch/boot/x86_64/initramfs-linux.img
}

